<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ============================================================
       META & SEO CONFIGURATION
       ============================================================ -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A clean, accessible counter widget built with plain HTML, CSS, and JavaScript. Portfolio piece by Moyosore Ogunde." />
  <meta name="author" content="Moyosore Ogunde" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="color-scheme" content="light dark" />

  <!-- ============================================================
       SECURITY HEADERS (Defense-in-Depth)
       Note: These are primarily served via vercel.json for
       production. Meta CSP acts as a secondary fallback.
       ============================================================ -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

  <title>Counter Widget | Moyosore Ogunde</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ============================================================
       MAIN CONTENT AREA
       ============================================================ -->
  <main class="counter-main" role="main" aria-labelledby="counterTitle">
    <div class="counter-card">
      <h1 class="counter-title" id="counterTitle">Counter Widget</h1>

      <!-- Display: current numeric value -->
      <div class="counter-value" id="counterValue" aria-live="polite" aria-atomic="true" role="status">0</div>

      <!-- Controls: increment / decrement buttons -->
      <div class="counter-controls" role="group" aria-label="Counter controls">
        <button class="btn btn-decrement" id="btnDecrement" type="button" aria-label="Decrease counter by 1">−1</button>
        <button class="btn btn-increment" id="btnIncrement" type="button" aria-label="Increase counter by 1">+1</button>
      </div>

      <!-- Reset control -->
      <button class="btn btn-reset" id="btnReset" type="button" aria-label="Reset counter to zero">Reset</button>
    </div>
  </main>

  <!-- ============================================================
       FOOTER / ATTRIBUTION
       ============================================================ -->
  <footer class="site-footer" role="contentinfo">
    <p>Built by <strong>Moyosore Ogunde</strong> — HTML · CSS · JavaScript</p>
  </footer>

  <!-- Defer script to end of body for performance and non-blocking parsing -->
  <script src="script.js" defer></script>
</body>
</html>
